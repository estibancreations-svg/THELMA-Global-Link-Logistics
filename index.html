
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MOTHER AI | EstibanCreations - Global Link Logistics</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.process = {
        env: {
          NODE_ENV: 'production',
          API_KEY: '' 
        }
      };

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: { 950: '#020617' },
              thelma: { sapphire: '#3b82f6', emerald: '#10b981', warning: '#f59e0b', ruby: '#ef4444' }
            },
            animation: {
              'pulse-warning': 'pulseWarning 2s infinite',
              'orb-float': 'orbFloat 6s infinite ease-in-out',
              'progress': 'progress 2s linear infinite',
              'spin-slow': 'spin 8s linear infinite',
              'scan': 'scan 2s linear infinite',
              'bounce-in': 'bounceIn 0.5s ease-out forwards',
              'fadeIn': 'fadeIn 0.5s ease-out forwards',
              'slideDown': 'slideDown 0.3s ease-out forwards',
              'slideInRight': 'slideInRight 0.3s ease-out forwards'
            },
            keyframes: {
              progress: { '0%': { transform: 'translateX(-100%)' }, '100%': { transform: 'translateX(100%)' } },
              fadeIn: { 'from': { opacity: '0' }, 'to': { opacity: '1' } },
              bounceIn: { 
                '0%': { transform: 'scale(0.3)', opacity: '0' },
                '50%': { transform: 'scale(1.05)', opacity: '1' },
                '70%': { transform: 'scale(0.9)' },
                '100%': { transform: 'scale(1)' }
              },
              slideDown: { 'from': { transform: 'translateY(-20px)', opacity: '0' }, 'to': { transform: 'translateY(0)', opacity: '1' } },
              slideInRight: { 'from': { transform: 'translateX(20px)', opacity: '0' }, 'to': { transform: 'translateX(0)', opacity: '1' } }
            }
          }
        }
      }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        height: 100%; width: 100%; margin: 0; padding: 0;
        font-family: 'Inter', sans-serif; background-color: #f8fafc;
        overflow: hidden;
      }
      .dark body { background-color: #020617; }
      #root { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      
      .app-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* LOCKED SECTIONS (Header/Sidebar stays put) */
      .header-area { flex-shrink: 0; }
      .sidebar-area { height: 100%; overflow: hidden; }

      /* INFINITE SCROLL CONTENT AREA */
      .main-area {
        flex: 1;
        overflow-y: auto !important;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        background-image: radial-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .dark .main-area {
        background-image: radial-gradient(rgba(30, 41, 59, 0.5) 1px, transparent 1px);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .module-container { 
        height: auto; 
        min-height: 100%; 
        display: block; 
        padding-bottom: 5rem;
      }

      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
    </style>
